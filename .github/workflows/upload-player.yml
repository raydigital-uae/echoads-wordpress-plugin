# Rebuilds a released player's standalone copy and uploads it to the bucket the Drupal
# module loads it from. Releases do this automatically (release-please.yml); use this to
# retry a failed upload or publish an older release. Run it from master: Google Cloud only
# accepts sign-ins from this repo's master branch.
name: Upload player

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v1.7.0
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Check the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a release tag: $TAG" >&2
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      # The upload script comes from master; the player is built from the release tag.
      - name: Checkout master
        uses: actions/checkout@v4

      - name: Checkout the release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          path: release

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build standalone player
        working-directory: release
        run: |
          bun install
          bun run build:standalone

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/119965281608/locations/global/workloadIdentityPools/github/providers/echoads-wordpress-plugin
          service_account: player-release@echoads.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Upload standalone player for Drupal
        run: scripts/upload-player.sh "$VERSION" release/build/standalone
