name: Release Please

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Lets the job sign in to Google Cloud without a stored key (Workload Identity Federation).
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build React assets
        run: bun run build

      - name: Create plugin zip
        run: |
          # Create a clean directory for the plugin
          mkdir -p dist/echoads-audio-player

          # Copy plugin files (excluding dev files)
          cp echoads-posts-plugin.php uninstall.php readme.txt LICENSE dist/echoads-audio-player/
          cp -r includes dist/echoads-audio-player/
          [ -d languages ] && cp -r languages dist/echoads-audio-player/ || true

          # WordPress.org reads the released version from the readme's Stable tag.
          sed -i "s/^Stable tag:.*/Stable tag: ${{ needs.release-please.outputs.version }}/" dist/echoads-audio-player/readme.txt

          # Copy assets (including built dist)
          mkdir -p dist/echoads-audio-player/assets
          cp -r assets/css assets/js assets/dist dist/echoads-audio-player/assets/
          cp assets/white-logo.png dist/echoads-audio-player/assets/

          # WordPress.org requires the source of the built player script (guideline 4).
          cp -r src package.json vite.config.ts tsconfig.json tsconfig.node.json dist/echoads-audio-player/
          find dist/echoads-audio-player -name '.DS_Store' -delete

          # WordPress.org's Plugin Check rejects a bundled React: the plugin's player must use WordPress's.
          if grep -q '@license React' dist/echoads-audio-player/assets/dist/echoads-audio-player.js; then
            echo "The plugin's player bundle includes React; it must use WordPress's (see vite.config.ts)." >&2
            exit 1
          fi

          # Create the zip file
          cd dist
          zip -r echoads-audio-player-${{ needs.release-please.outputs.version }}.zip echoads-audio-player

      # The copy EchoAds hosts for the Drupal module (storage bucket, player/v1/) bundles React,
      # so it is built separately and never goes into the plugin zip.
      - name: Build standalone player
        run: |
          bun run build:standalone
          mkdir -p dist/echoads-player-standalone
          cp build/standalone/echoads-audio-player.js build/standalone/echoads-audio-player.css dist/echoads-player-standalone/
          cd dist
          zip -r echoads-player-standalone-${{ needs.release-please.outputs.version }}.zip echoads-player-standalone

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            dist/echoads-audio-player-${{ needs.release-please.outputs.version }}.zip
            dist/echoads-player-standalone-${{ needs.release-please.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publishes the standalone player to player/<version>/ and player/v<major>/ in the
      # public bucket the Drupal module loads it from. Only this repo's master branch can
      # use this identity (see the provider's attribute condition in Google Cloud).
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/119965281608/locations/global/workloadIdentityPools/github/providers/echoads-wordpress-plugin
          service_account: player-release@echoads.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Upload standalone player for Drupal
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: scripts/upload-player.sh "$VERSION" build/standalone
